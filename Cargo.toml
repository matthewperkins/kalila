[workspace]
resolver = "3"
members = ["crates/oni-sys", "crates/ft600", "crates/rhythm", "crates/engine", "app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[workspace.dependencies]
anyhow = "1"
log = "0.4"
crossbeam-channel = "0.5"
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rtrb = "0.4"

[profile.release]
debug = 1
lto = "thin"
codegen-units = 4
[profile.dev]
opt-level = 1
[profile.dev.package."*"]
opt-level = 3
