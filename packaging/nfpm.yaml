# kalila's .deb and .rpm, written by nfpm (https://nfpm.goreleaser.com) from the glibc
# release folder. Run by packaging/ci-build.sh from inside that folder
# (target/release-dist/kalila-<version>-x86_64-linux-gnu/), so every `src` is a path there;
# KALILA_VERSION is set by that script.
name: kalila
arch: amd64
platform: linux
version: ${KALILA_VERSION}
version_schema: semver
release: 1
section: science
priority: optional
maintainer: Matthew Perkins <matthewperkins@users.noreply.github.com>
vendor: kalila
homepage: https://github.com/matthewperkins/kalila
license: GPL-3.0-or-later
description: |-
  Acquisition, display and recording for the Open Ephys acquisition board
  kalila acquires, displays and records electrophysiology from the Open Ephys acquisition
  board (ECP5 / FT600 USB 3 / ONI) in Open Ephys Binary format, with GPU-drawn traces
  (Vulkan), spike tiles and a spike audio monitor. kalila-headless records without windows.
  It reaches the board with its own FT600 driver; nothing from FTDI is needed.
  .
  The package installs a udev rule that lets local users open the board, and real-time
  limits for the members of the realtime group (created if missing; nobody is added):
    sudo usermod -aG realtime $USER
  then log out and in.

# Runtime libraries. kalila links libasound, libpipewire-0.3 and libgcc_s; the Vulkan loader,
# Wayland, xkbcommon and X11 are loaded at run time, so they are listed here by hand.
overrides:
  deb:
    depends:
      - libc6 (>= 2.34)
      - libgcc-s1
      # Debian 13 and Ubuntu 24.04 renamed these in the 64-bit time_t transition. The
      # fallback for ALSA is versioned: on Ubuntu 24.04 the bare name libasound2 is also
      # provided by liboss4-salsa-asound2, which lacks ALSA's versioned symbols (dimna's
      # release workflow found this, 2026-11-14).
      - libasound2t64 | libasound2 (>= 1.1)
      - libpipewire-0.3-0t64 | libpipewire-0.3-0
      - libvulkan1
      - libwayland-client0
      - libwayland-cursor0
      - libxkbcommon0
    recommends:
      # X11 sessions (Wayland needs none of these).
      - libx11-6
      - libx11-xcb1
      - libxcursor1
      - libxrandr2
      - libxi6
      - libxkbcommon-x11-0
      # A Vulkan driver for the GPU (NVIDIA's comes with its own driver package).
      - mesa-vulkan-drivers
  rpm:
    # By soname, as rpm records what a library provides: the same on RHEL/Alma/Rocky 9 and
    # Fedora whatever the package is called.
    depends:
      - libc.so.6(GLIBC_2.34)(64bit)
      - libgcc_s.so.1()(64bit)
      - libasound.so.2()(64bit)
      - libpipewire-0.3.so.0()(64bit)
      - libvulkan.so.1()(64bit)
      - libwayland-client.so.0()(64bit)
      - libwayland-cursor.so.0()(64bit)
      - libxkbcommon.so.0()(64bit)
    recommends:
      - libX11
      - libXcursor
      - libXrandr
      - libXi
      - libxkbcommon-x11
      - mesa-vulkan-drivers

rpm:
  summary: Acquisition, display and recording for the Open Ephys acquisition board
  compression: xz
  requires:
    # groupadd and getent, for the post-install script.
    post:
      - shadow-utils
      - glibc-common

deb:
  compression: xz

contents:
  - src: bin/kalila
    dst: /usr/bin/kalila
    file_info:
      mode: 0755
  - src: bin/kalila-headless
    dst: /usr/bin/kalila-headless
    file_info:
      mode: 0755

  - src: share/60-open-ephys-ft600.rules
    dst: /usr/lib/udev/rules.d/60-open-ephys-ft600.rules
    file_info:
      mode: 0644
  # A configuration file: an administrator's edits survive upgrades.
  - src: share/99-kalila-realtime.conf
    dst: /etc/security/limits.d/99-kalila-realtime.conf
    type: config|noreplace
    file_info:
      mode: 0644

  - src: share/kalila.desktop
    dst: /usr/share/applications/kalila.desktop
    file_info:
      mode: 0644
  - src: share/kalila-desktop-launch.sh
    dst: /usr/libexec/kalila/kalila-desktop-launch
    file_info:
      mode: 0755

  - src: share/icon/kalila-32.png
    dst: /usr/share/icons/hicolor/32x32/apps/kalila.png
    file_info:
      mode: 0644
  - src: share/icon/kalila-48.png
    dst: /usr/share/icons/hicolor/48x48/apps/kalila.png
    file_info:
      mode: 0644
  - src: share/icon/kalila-64.png
    dst: /usr/share/icons/hicolor/64x64/apps/kalila.png
    file_info:
      mode: 0644
  - src: share/icon/kalila-128.png
    dst: /usr/share/icons/hicolor/128x128/apps/kalila.png
    file_info:
      mode: 0644
  - src: share/icon/kalila-256.png
    dst: /usr/share/icons/hicolor/256x256/apps/kalila.png
    file_info:
      mode: 0644
  - src: share/icon/kalila-icon.svg
    dst: /usr/share/icons/hicolor/scalable/apps/kalila.svg
    file_info:
      mode: 0644

  - src: README.md
    dst: /usr/share/doc/kalila/README.md
    file_info:
      mode: 0644
  - src: BUILD-INFO
    dst: /usr/share/doc/kalila/BUILD-INFO
    file_info:
      mode: 0644
  - src: COMMIT
    dst: /usr/share/doc/kalila/COMMIT
    file_info:
      mode: 0644
  - src: share/icon/ICON-CREDITS.md
    dst: /usr/share/doc/kalila/ICON-CREDITS.md
    file_info:
      mode: 0644
  - src: licenses
    dst: /usr/share/doc/kalila/licenses
    type: tree

  - dst: /usr/libexec/kalila
    type: dir
    file_info:
      mode: 0755

scripts:
  postinstall: package-postinstall.sh
  postremove: package-postremove.sh
