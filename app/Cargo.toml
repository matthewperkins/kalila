[package]
name = "oers"
version.workspace = true
edition.workspace = true
description = "Open Ephys acquisition GUI (egui + wgpu/Vulkan)"

[dependencies]
engine = { path = "../crates/engine" }
eframe = { version = "0.37", default-features = false, features = ["wgpu", "wayland", "x11", "default_fonts"] }
bytemuck = { version = "1", features = ["derive"] }
log.workspace = true
env_logger = "0.11"
serde.workspace = true
serde_json.workspace = true
